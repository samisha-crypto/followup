<script>

const DAY=864e5,STALE=2,ESC=5,$=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
let db,user,me,mgr=false,own=false,joining=0,swept=0,ready={},names={},avatars={},D={projects:[],todos:[],todolists:[],posts:[],chat:[],checkins:[],checkinRequests:[],checkinAnswers:[],checkinComments:[],inbox:[],members:[],settings:[],dms:[],files:[],preusers:[],invites:[]},TR={projects:[],todos:[],posts:[]},bell=false,ibf='all',XP={},gt='in',nosign=false,tid=null,sq='',dmw=null,mnT=null,mnS=0,v='home',pid=null,tool=null,post=null,forms={},pick=null,dirty=false,armed=null;
const nm=id=>id==='system'?'FollowUp':id===me?'You':(names[id]||'Someone'),ago=t=>{const d=Math.floor((Date.now()-t)/DAY);return d<1?'today':d==1?'1 day ago':d+' days ago'};
const col=s=>'hsl('+([...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)%360)+' 55% 48%)',toast=m=>{const d=$('#ts');d.textContent=m;d.style.display='block';setTimeout(()=>d.style.display='none',3500)};

const applyAppearance=()=>{document.documentElement.dataset.theme=M(me).theme||'system';document.documentElement.dataset.accent=M(me).accent||'blue'};

async function uploadFiles(id){const input=$('#'+id),picked=[...(input?.files||[])];if(!picked.length)return[];try{const assets=await claude.use('assets');if(!assets)throw new Error('File uploads are unavailable');const out=[];for(const f of picked){const r=await assets.upload(f);out.push({aid:r.id,name:r.name||f.name,size:r.sizeBytes||f.size,type:r.type||f.type||'application/octet-stream'})}return out}catch(e){fail(e);return null}}

const R=()=>own?'admin':(D.members.find(m=>m.id===me)||{}).role||'member',canW=()=>R()!=='viewer',W=['add','addList','createList','post','nudge','msg','reply','say','chk','ciPlan','ciAnswer','ciComment','ciToggle','ciAnswerDelete','ciCommentDelete','inboxSend','pj+','saveq','rx','dmsend','mv','up','fdel','es','eps'],EM=['👍','❤️','🎉','👀','🙏','✅'],who=()=>names[me]||'Someone';

 if(document.hidden){clearInterval(flash);let n=0;const t0=document.title;flash=setInterval(()=>{document.title=n++%2?t0:'🔔 New alert!';if(!document.hidden||n>60){clearInterval(flash);document.title=t0}},1000)}
